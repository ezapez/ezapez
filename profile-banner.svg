<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1160" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset="0.48" stop-color="#0B2442"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(870 150) rotate(90) scale(260 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#7DD3FC" stroke-opacity="0.07"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="26" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="26" fill="url(#glow)"/>
  <path d="M0 286C235 224 363 345 604 286C820 233 1002 240 1200 296V340H0V286Z" fill="#38BDF8" fill-opacity="0.055"/>

  <!-- Terminal-style code mark -->
  <g filter="url(#shadow)">
    <rect x="55" y="64" width="248" height="212" rx="20" fill="#020617" fill-opacity="0.72" stroke="#38BDF8" stroke-opacity="0.45"/>
    <circle cx="82" cy="89" r="6" fill="#FB7185"/>
    <circle cx="103" cy="89" r="6" fill="#FBBF24"/>
    <circle cx="124" cy="89" r="6" fill="#34D399"/>
    <path d="M120 146L86 174L120 202" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
    <path d="M181 146L215 174L181 202" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
    <path d="M168 132L140 216" stroke="#7DD3FC" stroke-width="7" stroke-linecap="round"/>
    <text x="85" y="244" fill="#94A3B8" font-family="Consolas, monospace" font-size="14">pipeline.run()</text>
  </g>

  <!-- Name and role -->
  <text x="350" y="126" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="1">EDGAR ZAPATA</text>
  <text x="354" y="176" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="2.2">BACKEND DEVELOPER</text>
  <rect x="354" y="198" width="570" height="3" rx="1.5" fill="url(#cyan)"/>
  <text x="354" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="20">Automation  •  Data Pipelines  •  Systems Integration</text>

  <!-- Data-flow graphic -->
  <g transform="translate(970 84)">
    <path d="M-12 78H36M36 78V31M36 78V125M36 31H78M36 125H78" stroke="#7DD3FC" stroke-width="3" stroke-opacity="0.72"/>
    <circle cx="-23" cy="78" r="17" fill="#082F49" stroke="#22D3EE" stroke-width="3"/>
    <rect x="78" y="15" width="82" height="32" rx="9" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
    <rect x="78" y="109" width="82" height="32" rx="9" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
    <path d="M-33 72H-13M-33 78H-13M-33 84H-13" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round"/>
    <text x="93" y="36" fill="#E0F2FE" font-family="Consolas, monospace" font-size="13">VALIDATE</text>
    <text x="96" y="130" fill="#E0F2FE" font-family="Consolas, monospace" font-size="13">AUTOMATE</text>
  </g>

  <!-- Footer pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="354" y="270" width="116" height="32" rx="16" fill="#0369A1" fill-opacity="0.8"/><text x="378" y="291" fill="white">PYTHON</text>
    <rect x="482" y="270" width="105" height="32" rx="16" fill="#0369A1" fill-opacity="0.8"/><text x="508" y="291" fill="white">SQL</text>
    <rect x="599" y="270" width="116" height="32" rx="16" fill="#0369A1" fill-opacity="0.8"/><text x="623" y="291" fill="white">DOCKER</text>
    <rect x="727" y="270" width="112" height="32" rx="16" fill="#0369A1" fill-opacity="0.8"/><text x="751" y="291" fill="white">AZURE</text>
  </g>
</svg>
